[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "data-analysis-agent"
version = "2.0.0"
description = "企业级 LLM 驱动的智能数据分析代理"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Data Analysis Agent Team" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",

    # LLM & AI Orchestration
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",

    # RAG & Vector DB
    "chromadb>=0.5.0",
    "langchain-chroma>=0.2.0",
    "tiktoken>=0.7.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncmy>=0.2.9",

    # Redis
    "redis[hiredis]>=5.0.0",
    "arq>=0.26.0",

    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Validation & Config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Data Analysis (preserved)
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.6.0",
    "duckdb>=0.8.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.14.0",

    # IPython / Jupyter
    "ipython>=8.10.0",

    # Reports
    "python-docx>=0.8.11",

    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "aiofiles>=24.0.0",
    "httpx>=0.27.0",
    "fonttools>=4.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
# 只打包 daa 包及其子包。仓库根目录还存在 config/utils/tests 等顶层包，
# 不显式指定会让 setuptools flat-layout 自动发现报
# "Multiple top-level packages discovered" 错误，导致 `pip install .` 失败。
include = ["daa*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
exclude = '/(\.git|\.mypy_cache|\.pytest_cache|alembic)/'

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
